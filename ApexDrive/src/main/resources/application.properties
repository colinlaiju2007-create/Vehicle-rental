server.port=${PORT:8080}

# SQLite database URL. For local runs, use ./apexdrive.db.
# On Render, set APEXDRIVE_DB_URL=jdbc:sqlite:/var/data/apexdrive.db
spring.datasource.url=${APEXDRIVE_DB_URL:jdbc:sqlite:apexdrive.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.web.resources.static-locations=classpath:/static/

# Override these environment variables on the hosting service before making public.
apexdrive.admin.username=${APEXDRIVE_ADMIN_USERNAME:admin}
apexdrive.admin.password=${APEXDRIVE_ADMIN_PASSWORD:ApexAdmin2026!}

logging.level.com.apexdrive=INFO
logging.level.org.springframework.web=INFO
